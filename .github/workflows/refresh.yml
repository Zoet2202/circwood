name: Refresh SSB data

# Turns "reproducible" into "self-maintaining": pull fresh SSB data, prove the
# rebuilt dataset balances, reconciles and has not drifted from the previous
# vintage, then open a PR. No step commits to a branch anyone reads — the CSV is
# the canonical artifact precisely so the change is reviewable as a diff.

on:
  schedule:
    # 05:00 UTC on the 4th of each month. SSB publishes on its own calendar; the
    # 4th avoids the 1st-of-month crush on GitHub's scheduler, which delays jobs.
    - cron: "0 5 4 * *"
  workflow_dispatch:
    inputs:
      threshold:
        description: "Relative flow move that fails the run (0.05 = 5%)"
        required: false
        default: "0.05"
      min_volume:
        description: "Ignore relative moves on flows below this volume (m3)"
        required: false
        default: "1000"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-ssb
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e .[dev,ssb]

      # Before touching the data: prove the code is sound against the dataset
      # already committed. If this is red, a refresh would only add noise to an
      # existing failure.
      - name: Test against the committed dataset
        run: pytest -q

      # Ingest -> rebuild -> manifest -> mass balance -> reconcile -> vintage
      # diff -> golden fixture. Restores the previous outputs and exits non-zero
      # if any gate fails, so a bad SSB vintage never reaches a commit.
      - name: Refresh and gate
        id: refresh
        env:
          CIRCWOOD_CONTACT: ${{ github.server_url }}/${{ github.repository }}
        run: |
          circwood-refresh \
            --threshold "${{ github.event.inputs.threshold || '0.05' }}" \
            --min-volume "${{ github.event.inputs.min_volume || '1000' }}" \
            --report "$RUNNER_TEMP/refresh_report.md"

      # Now that the dataset and its golden fixture have moved together, the
      # suite must be green again. This is what proves the refreshed state is
      # self-consistent rather than merely generated.
      - name: Test against the refreshed dataset
        run: pytest -q

      - name: Check for changes
        id: changed
        run: |
          if [ -n "$(git status --porcelain data/processed tests/fixtures)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "SSB published nothing new — dataset unchanged, no PR needed."
          fi

      - name: Open a pull request
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="refresh/ssb-$(date -u +%Y-%m-%d)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/processed tests/fixtures
          git commit -m "Refresh SSB data ($(date -u +%Y-%m-%d))"
          git push --force-with-lease origin "$BRANCH"
          if ! gh pr create \
              --title "Refresh SSB data ($(date -u +%Y-%m-%d))" \
              --body-file "$RUNNER_TEMP/refresh_report.md" \
              --base "${{ github.ref_name }}" \
              --head "$BRANCH"; then
            # A PR for this branch already exists (a same-day re-run): update it.
            gh pr comment "$BRANCH" --body-file "$RUNNER_TEMP/refresh_report.md"
          fi

      # A refresh that fails silently is worse than no refresh: the data just
      # goes stale while the badge stays green. Leave a visible artifact and an
      # issue naming the failure.
      - name: Upload the failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-report
          path: ${{ runner.temp }}/refresh_report.md
          if-no-files-found: ignore

      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="$(cat "$RUNNER_TEMP/refresh_report.md" 2>/dev/null || echo 'No report was produced — the run failed before the refresh step.')"
          gh issue create \
            --title "SSB refresh failed ($(date -u +%Y-%m-%d))" \
            --label "data-refresh" \
            --body "$(printf '%s\n\n[Run log](%s/%s/actions/runs/%s)\n' \
                      "$BODY" "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")" \
            || echo "Could not open an issue (missing 'data-refresh' label?); see the run log."
