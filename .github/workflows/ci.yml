name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The ssb extras are installed so the ingestion tests actually run rather
      # than skipping. They are fully mocked — CI never calls the SSB API.
      - name: Install package (with dev + ssb extras)
        run: pip install -e .[dev,ssb]

      - name: Run tests
        run: pytest -q

  # Lint and types (ROADMAP Phase I). ruff format is enforced by pre-commit on
  # touched files only, so an adopted formatter never produces a repo-wide diff
  # in the same change as a data regeneration.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package (dev extras)
        run: pip install -e .[dev,ssb]
      - name: ruff
        run: ruff check src tests app models
      - name: mypy
        run: mypy
